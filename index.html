let rankFilter = { period:'all', deck:'' };
function renderRanking(){
  const list = matches().filter(m => rankFilter.period === 'all' || m.date > Date.now() - 30 * 864e5);
  const P = {}, D = {};
  let starterWins = 0;
  list.forEach(m => {
    if(m.starter === m.winner) starterWins++;
    m.players.forEach((p, i) => {
      const pk = p.memberId || p.memberName;
      const pp = P[pk] = P[pk] || { name:p.memberName, games:0, wins:0, deckWins:{} };
      pp.games++;
      if(i === m.winner){ pp.wins++; pp.deckWins[p.deckName] = (pp.deckWins[p.deckName] || 0) + 1; }
      if(p.deckId){
        const dd = D[p.deckId] = D[p.deckId] || { id:p.deckId, name:p.deckName, owner:p.memberName, commander:p.commander, artCard:p.artCard, art:p.art, games:0, wins:0 };
        dd.games++; if(i === m.winner) dd.wins++;
      }
    });
  });
  const pct = (w, g) => g ? Math.round(w / g * 100) : 0;
  const players = Object.values(P).sort((a,b) => b.wins - a.wins || pct(b.wins,b.games) - pct(a.wins,a.games));
  const decks = Object.values(D).sort((a,b) => b.wins - a.wins || pct(b.wins,b.games) - pct(a.wins,a.games));
  if(!rankFilter.deck || !D[rankFilter.deck]) rankFilter.deck = decks[0] ? decks[0].id : '';
  // Enfrentamientos del mazo elegido contra cada rival
  const H = {};
  list.forEach(m => {
    const me = m.players.findIndex(p => p.deckId === rankFilter.deck);
    if(me < 0) return;
    m.players.forEach((p, j) => {
      if(j === me || !p.deckId) return;
      const h = H[p.deckId] = H[p.deckId] || { name:p.deckName, owner:p.memberName, artCard:p.artCard, art:p.art, together:0, beat:0, lost:0 };
      h.together++;
      if(m.winner === me) h.beat++;
      if(m.winner === j) h.lost++;
    });
  });
  const rivals = Object.values(H).sort((a,b) => (b.beat - b.lost) - (a.beat - a.lost) || b.together - a.together);
  const medal = i => `<span class="medal ${i < 3 ? 'm' + (i + 1) : ''}">${i + 1}</span>`;
  const thumb = (n, u) => `<span class="dthumb" style="${artOf(n, u) ? `background-image:url('${artOf(n, u)}')` : ''}"></span>`;
  const best = players[0], bestDeck = decks[0];
  $('#main').innerHTML = `
  <div class="page-h band" style="${bandStyle(3)}">
    <div><div class="kicker">El salón de la fama</div><h1>Ranking</h1><p>Partidas guardadas en La Mesa por todos los jugadores de Mana Beer.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select class="input" id="rkPeriod" style="width:auto"><option value="all" ${rankFilter.period==='all'?'selected':''}>Todas las partidas</option><option value="30" ${rankFilter.period==='30'?'selected':''}>Últimos 30 días</option></select>
      <button class="btn primary" data-act="goTab" data-tab="mesa">A La Mesa</button>
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><small>Partidas jugadas</small><b>${list.length}</b><div class="sub">${list.reduce((a,m)=>a+m.minutes,0)} min en la mesa</div></div>
    <div class="metric"><small>Campeón de la taberna</small><b style="font-family:var(--brand)">${best ? esc(best.name) : '—'}</b><div class="sub">${best ? `${best.wins} victorias · ${pct(best.wins,best.games)}%` : ''}</div></div>
    <div class="metric"><small>Mazo más ganador</small><b style="font-size:17px">${bestDeck ? esc(bestDeck.name) : '—'}</b><div class="sub">${bestDeck ? `${esc(bestDeck.owner)} · ${bestDeck.wins} victorias` : ''}</div></div>
    <div class="metric"><small>El que empieza gana</small><b>${pct(starterWins, list.length)}%</b><div class="sub">de las partidas</div></div>
  </div>
  ${!list.length ? `<div class="empty"><b>Todavía no hay partidas</b>Juega en La Mesa y guarda el resultado para empezar el ranking.</div>` : `
  <div class="rank-grid">
    <div class="rsec"><h3><span>Jugadores</span></h3>
      ${players.map((p, i) => `<div class="rrow">${medal(i)}<div class="rname"><b>${esc(p.name)}</b><small>Mazo estrella: ${esc(Object.entries(p.deckWins).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—')}</small><div class="rbar"><i style="width:${pct(p.wins,p.games)}%"></i></div></div><div class="rstat"><b>${p.wins}</b>${p.games} partidas · ${pct(p.wins,p.games)}%</div></div>`).join('')}
    </div>
    <div class="rsec"><h3><span>Mazos</span></h3>
      ${decks.slice(0, 10).map((d, i) => `<div class="rrow">${medal(i)}<div class="rdeck">${thumb(d.artCard, d.art)}<div class="rname"><b>${esc(d.name)}</b><small>${esc(d.owner)}${d.commander ? ' · ' + esc(d.commander) : ''}</small></div></div><div class="rstat"><b>${d.wins}</b>${d.games} partidas · ${pct(d.wins,d.games)}%</div></div>`).join('')}
    </div>
    <div class="rsec"><h3><span>Enfrentamientos</span>
        <select class="input" id="rkDeck" style="width:auto;max-width:100%;font-family:var(--font);font-size:13px">${decks.map(d => `<option value="${d.id}" ${d.id===rankFilter.deck?'selected':''}>${esc(d.name)} (${esc(d.owner)})</option>`).join('')}</select></h3>
      <p class="hint" style="margin:-4px 0 8px">Contra cada rival: cuántas veces ganó este mazo con ese rival en la mesa, y cuántas ganó el rival.</p>
      ${rivals.map(h => `<div class="rrow" style="grid-template-columns:1fr auto"><div class="rdeck">${thumb(h.artCard, h.art)}<div class="rname"><b>${esc(h.name)}</b><small>${esc(h.owner)} · ${h.together} partida(s) juntos</small></div></div><div class="rstat"><span class="chip ok">Le ganó ${h.beat}</span><span class="chip err">Perdió ${h.lost}</span></div></div>`).join('') || '<p class="hint">Este mazo aún no tiene enfrentamientos.</p>'}
    </div>
    <div class="rsec"><h3><span>Últimas partidas</span></h3>
      <div class="hist">${list.slice(0, 8).map(m => `<div class="hrow"><span class="when">${new Date(m.date).toLocaleDateString('es-MX', { day:'numeric', month:'short' })} · ${m.minutes} min</span>
        ${m.players.map((p, i) => `<span class="hp ${i===m.winner?'win':''} ${i===m.starter?'first':''}" title="${esc(p.memberName)} · ${esc(p.deckName)}${i===m.starter?' · empezó':''}"><i style="${artOf(p.artCard, p.art) ? `background-image:url('${artOf(p.artCard, p.art)}')` : ''}"></i>${esc(p.memberName)}${i===m.winner?' ★':''}</span>`).join('')}</div>`).join('')}</div>
    </div>
  </div>`}`;
  const per = $('#rkPeriod'); if(per) per.onchange = e => { rankFilter.period = e.target.value; renderRanking(); };
  const rd = $('#rkDeck'); if(rd) rd.onchange = e => { rankFilter.deck = e.target.value; renderRanking(); };
}

const MANA_KEYS = ['W','U','B','R','G','C'];
const PIPC = { W:['#F8F3D9','#5C5532'], U:['#3E8FD8','#fff'], B:['#3A3534','#D9D3D0'], R:['#D9533B','#fff'], G:['#3D9B5A','#fff'], C:['#B9B5AD','#333'] };

  dagger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 3v9h-4V5z" fill="currentColor"/><path d="M7 14h10M12 14v4"/><circle cx="12" cy="20" r="1.6" fill="currentColor"/></svg>',

};
let game = null, mesaPanel = null, mesaMenuOpen = false;
const lifeAcc = {}, lifeTimers = {};
const curLayout = () => LAYOUTS.find(l => l.id === game.layout) || LAYOUTS[5];
// Formatos: definen jugadores, vidas y si se cuenta daño de comandante
const MESA_FORMATS = [
  { id:'commander', name:'Commander', life:40, n:4, layout:'4a', cmd:true },
  { id:'duel', name:'Commander 1 vs 1', life:20, n:2, layout:'2a', cmd:true },
  { id:'brawl', name:'Brawl', life:25, n:2, layout:'2a', cmd:false },
  { id:'standard', name:'Standard', life:20, n:2, layout:'2a', cmd:false },
  { id:'pioneer', name:'Pioneer', life:20, n:2, layout:'2a', cmd:false },
  { id:'modern', name:'Modern', life:20, n:2, layout:'2a', cmd:false },
  { id:'pauper', name:'Pauper', life:20, n:2, layout:'2a', cmd:false },
  { id:'legacy', name:'Legacy', life:20, n:2, layout:'2a', cmd:false },
  { id:'vintage', name:'Vintage', life:20, n:2, layout:'2a', cmd:false }
];
const curFormat = () => MESA_FORMATS.find(f => f.id === (game && game.format)) || MESA_FORMATS[0];
const cmdOn = () => curFormat().cmd;
const MAX_CMDRS = 3;
const newPlayer = life => ({ member:null, deck:null, life, poison:0, cmd:{}, cmdN:1, mana:{ W:0, U:0, B:0, R:0, G:0, C:0 } });
function newGame(layoutId, life, keep){
  const L = LAYOUTS.find(l => l.id === layoutId) || LAYOUTS[5];
  const old = keep && game ? game.players : [];
  const format = (game && game.format) || 'commander';
  game = { layout:L.id, startLife:life, format, started:Date.now(), starter:null, prompted:false, cmdTarget:null,
    players: Array.from({ length:L.n }, (_, i) => { const p = newPlayer(life); if(old[i]){ p.member = old[i].member; p.deck = old[i].deck; p.cmdN = old[i].cmdN || 1; } return p; }) };
  saveGame();
}
// Partidas guardadas con la versión anterior
function normalizeGame(){
  if(!game) return;
  if(!game.format) game.format = game.startLife === 40 ? 'commander' : 'standard';
  if(game.cmdTarget === undefined) game.cmdTarget = null;
  game.players.forEach(p => {
    p.cmdN = p.cmdN || 1;
    Object.keys(p.cmd || {}).forEach(j => { if(!Array.isArray(p.cmd[j])) p.cmd[j] = [p.cmd[j] || 0]; });
  });
}
function saveGame(){ store.set('game_' + (user ? user.uid : ''), game); }
function loadGame(){
  game = store.get('game_' + (user ? user.uid : ''), null);
  normalizeGame();
  if(!game){
    newGame('4a', 40);
    const me = currentMember();
    if(me) game.players[0].member = me.id;
    saveGame();
  }
}
const isDead = p => p.life <= 0 || p.poison >= 10 || Object.values(p.cmd || {}).some(v => (Array.isArray(v) ? v : [v]).some(x => x >= 21));
const pName = i => { const p = game.players[i], m = p && p.member ? memberById(p.member) : null; return m ? m.name : `Jugador ${i + 1}`; };

function renderMesa(){
  if(!game) loadGame();

  </div>`;
  mesaMenuOpen = false;
  requestAnimationFrame(sizeMesa);
  if(mesaPanel) renderCounters(mesaPanel.i, mesaPanel.t);
}

      }).join('')}</div>
      <div class="cg-foot">${n < MAX_CMDRS ? `<button data-act="cmdSlot" data-a="${i}" data-d="1">+ Comandante</button>` : ''}${n > 1 ? `<button data-act="cmdSlot" data-a="${i}" data-d="-1">− Comandante</button>` : ''}</div></div>`;
  }
  return `<div class="pcell ${dead ? 'dead' : ''} ${game.starter === i ? 'starter' : ''} ${T != null ? 'in-cmd' : ''}" id="pc${i}" data-i="${i}" data-rot="${rot}" style="grid-row:${r} / span ${rs};grid-column:${c} / span ${cs}">

      ${art ? `<div class="pbg" style="background-image:url('${art}')"></div>` : `<div class="pbg free"><img src="${LOGO_SRC}" alt=""></div>`}

      <div class="lifezone">
        <button class="lifebtn m" data-i="${i}" data-d="-1" aria-label="Restar vida">−</button>
        <button class="lifebtn p" data-i="${i}" data-d="1" aria-label="Sumar vida">+</button>
      </div>
      <div class="life">${p.life}</div>
      <div class="delta" id="dl${i}"></div>
      <div class="pchips">
        <button class="pchip poison ${p.poison ? 'on' : ''}" data-act="counters" data-i="${i}" data-t="poison" title="Contadores de veneno">${MICO.poison}<span>${p.poison}</span></button>
        <button class="pchip ${manaTot ? 'on' : ''}" data-act="counters" data-i="${i}" data-t="mana" title="Maná disponible">${MICO.mana}<span>${manaTot}</span></button>
        ${MANA_KEYS.filter(k => (p.mana[k] || 0) > 0).map(k => `<button class="mpip2" data-act="counters" data-i="${i}" data-t="mana" style="background:${PIPC[k][0]};color:${PIPC[k][1]}" title="Maná ${k}">${p.mana[k]}</button>`).join('')}
      </div>
      ${game.starter === i ? '<div class="startflag">¡EMPIEZA!</div>' : ''}
      ${dead ? '<div class="deadtxt">SIN<br>CERVEZA</div>' : ''}
      <div class="roll" id="roll${i}"></div>
      ${overlay}
      <div id="cp${i}"></div>
    </div>
  </div>`;
}
function sizeCell(cell){
  const rot = Math.abs(+cell.dataset.rot), rc = cell.getBoundingClientRect(), side = rot === 90;
  const w = side ? rc.height : rc.width, h = side ? rc.width : rc.height, pr = cell.querySelector('.prot');
  pr.style.width = w + 'px'; pr.style.height = h + 'px';
  pr.style.setProperty('--fs', Math.max(28, Math.min(w * .36, h * .5)) + 'px');
}
function sizeMesa(){ document.querySelectorAll('.pcell').forEach(sizeCell); }
function renderCell(i){
  const old = $('#pc' + i); if(!old) return;
  old.outerHTML = cellHtml(i);
  sizeCell($('#pc' + i));
  if(mesaPanel && mesaPanel.i === i) renderCounters(i, mesaPanel.t);
}
let saveT = null;
const saveGameSoon = () => { clearTimeout(saveT); saveT = setTimeout(saveGame, 300); };
function changeLife(i, d){
  const p = game.players[i]; if(!p) return;
  const wasDead = isDead(p);
  p.life += d;
  const cell = $('#pc' + i); if(!cell) return;
  const lf = cell.querySelector('.life'); lf.textContent = p.life; lf.classList.add('bump'); setTimeout(() => lf.classList.remove('bump'), 90);
  lifeAcc[i] = (lifeAcc[i] || 0) + d;
  const dl = $('#dl' + i); dl.textContent = (lifeAcc[i] > 0 ? '+' : '') + lifeAcc[i]; dl.classList.add('show'); dl.classList.toggle('neg', lifeAcc[i] < 0);
  clearTimeout(lifeTimers[i]); lifeTimers[i] = setTimeout(() => { lifeAcc[i] = 0; const x = $('#dl' + i); if(x) x.classList.remove('show'); }, 1400);
  if(wasDead !== isDead(p)) renderCell(i);
  saveGameSoon(); checkWinner();
}
function checkWinner(){
  if(game.players.length < 2 || game.prompted) return;
  const alive = game.players.map((p, i) => isDead(p) ? -1 : i).filter(i => i >= 0);
  if(alive.length === 1){
    game.prompted = true; saveGame();
    const w = alive[0];
    showSheet(`<h3>¡${esc(pName(w))} se queda con la última cerveza!</h3>
      <p class="lead">${game.players[w].deck ? esc(game.players[w].deck.name) + ' gana la partida.' : 'Gana la partida.'} ¿La guardamos para el Ranking?</p>
      <div class="sheet-actions"><button class="btn ghost" data-act="mesaCloseOv">Seguir jugando</button><button class="btn primary" data-act="mesaSaveMatch" data-i="${w}">Guardar partida</button></div>`);
  }
}
// Gestos en cada celda:
//  · tocar − / +           → resta o suma 1 de vida
//  · mantener presionado    → resta o suma de 10 en 10
//  · deslizar a los lados   → modo daño de comandante para ese jugador (en su propio sentido de lectura)
let gesture = null, suppressClickUntil = 0, suppressCell = -1;
document.addEventListener('pointerdown', e => {
  if(!game || view.tab !== 'mesa') return;
  const cell = e.target.closest('.pcell');
  if(!cell || e.target.closest('.cpanel')) return;
  const btn = e.target.closest('.lifebtn');
  if(btn) e.preventDefault();
  const g = gesture = { i: +cell.dataset.i, rot: +cell.dataset.rot, x0: e.clientX, y0: e.clientY, btn, moved:false, held:false, swiped:false, rep:null, hold:null };
  if(btn){
    const i = +btn.dataset.i, d = +btn.dataset.d;
    g.hold = setTimeout(() => { if(g.moved) return; g.held = true; changeLife(i, d * 10); g.rep = setInterval(() => changeLife(i, d * 10), 600); }, 550);
  }
}, { passive:false });
document.addEventListener('pointermove', e => {
  const g = gesture; if(!g) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if(!g.moved && Math.hypot(dx, dy) > 12){ g.moved = true; if(!g.held) clearTimeout(g.hold); }
  if(g.swiped || g.held) return;
  const a = -g.rot * Math.PI / 180, lx = dx * Math.cos(a) - dy * Math.sin(a), ly = dx * Math.sin(a) + dy * Math.cos(a);
  if(Math.abs(lx) > 55 && Math.abs(lx) > Math.abs(ly) * 1.4){ g.swiped = true; toggleCmd(g.i); }
});
const endGesture = () => {
  const g = gesture; if(!g) return;
  gesture = null;
  clearTimeout(g.hold); clearInterval(g.rep);
  if(g.swiped || g.moved){ suppressClickUntil = Date.now() + 350; suppressCell = g.i; return; }
  if(g.btn && !g.held) changeLife(+g.btn.dataset.i, +g.btn.dataset.d);
};
document.addEventListener('pointerup', endGesture);
document.addEventListener('pointercancel', () => { const g = gesture; if(g){ clearTimeout(g.hold); clearInterval(g.rep); } gesture = null; });
// Evita que un deslizamiento termine "tocando" un botón
document.addEventListener('click', e => { const c = e.target.closest('.pcell'); if(c && +c.dataset.i === suppressCell && Date.now() < suppressClickUntil){ e.stopPropagation(); e.preventDefault(); } }, true);
function toggleCmd(i){
  if(!cmdOn()){ mesaToast(`En ${curFormat().name} no se cuenta daño de comandante.`); return; }
  game.cmdTarget = game.cmdTarget === i ? null : i;
  mesaPanel = null; saveGameSoon(); renderMesa();
}
window.addEventListener('resize', () => { if(view.tab === 'mesa') sizeMesa(); });

// ---------- Contadores: daño de comandante, veneno y maná ----------
function renderCounters(i, t){
  const p = game.players[i], host = $('#cp' + i); if(!host) return;
  mesaPanel = { i, t };
  const row = (label, val, attrs, hot) => `<div class="crow"><span>${label}</span><div class="ctr"><button data-act="cnt" ${attrs} data-d="-1">−</button><b class="${hot ? 'hot' : ''}">${val}</b><button data-act="cnt" ${attrs} data-d="1">+</button></div></div>`;
  let body = '';
  if(t === 'poison'){
    body = row('Contadores de veneno', p.poison, `data-i="${i}" data-k="poison"`, p.poison >= 10) + '<div class="cnote">Con 10 contadores de veneno, quedas fuera.</div>';
  } else {
    body = MANA_KEYS.map(k => row(`<span class="mpip" style="background:${PIPC[k][0]};color:${PIPC[k][1]}">${k}</span>${{W:'Blanco',U:'Azul',B:'Negro',R:'Rojo',G:'Verde',C:'Incoloro'}[k]}`, p.mana[k] || 0, `data-i="${i}" data-k="mana" data-j="${k}"`)).join('')
      + `<button class="btn sm" style="align-self:center;margin-top:4px" data-act="manaClear" data-i="${i}">Vaciar reserva de maná</button>`;
  }
  host.innerHTML = `<div class="cpanel">
    <div class="ctabs">${[['poison','Veneno'],['mana','Maná']].map(([k, l]) => `<button class="ctab ${k === t ? 'on' : ''}" data-act="counters" data-i="${i}" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="cbody">${body}</div>
    <button class="cclose" data-act="closeCounters" data-i="${i}" aria-label="Cerrar">✕</button></div>`;
}

// ---------- Menú central y hojas ----------
function showSheet(html){
  const ov = $('#mesaOv'); if(!ov) return;
  ov.innerHTML = `<div class="ov-back" data-act="mesaCloseOv"></div><div class="sheet">${html}</div>`;
  ov.classList.add('on'); $('#mesa').classList.add('sheet-open'); $('#mesa').classList.remove('menu-open'); mesaMenuOpen = false;
}
function closeOv(){
  const ov = $('#mesaOv'); if(!ov) return;
  ov.classList.remove('on'); ov.innerHTML = '';
  $('#mesa').classList.remove('sheet-open', 'menu-open'); mesaMenuOpen = false;
}
function openMenu(){
  const items = [['mesaLayout','Jugadores','#3CCB7F'],['mesaRoll','¿Quién empieza?','#38C6E8'],['mesaSettings','Ajustes','#A78BFA'],['mesaEnd','Terminar partida','#FF5C8A'],['mesaExit','Salir','#F2B52E'],['mesaReset','Reiniciar','#F5D76E']];
  const R = Math.min(150, Math.min(innerWidth, innerHeight) * .3);
  const ov = $('#mesaOv');
  ov.innerHTML = `<div class="ov-back" data-act="mesaCloseOv"></div>` + items.map(([act, label, col], k) => {
    const ang = -90 + k * 60, rad = ang * Math.PI / 180;
    let rot = ang; if(rot > 90) rot -= 180; if(rot < -90) rot += 180;
    return `<button class="pill" data-act="${act}" style="background:${col};transform:translate(-50%,-50%) translate(${(Math.cos(rad) * R).toFixed(0)}px,${(Math.sin(rad) * R).toFixed(0)}px) rotate(${rot}deg);animation-delay:${k * 30}ms">${label}</button>`;
  }).join('');
  ov.classList.add('on'); $('#mesa').classList.add('menu-open'); mesaMenuOpen = true;
}
function layoutThumb(l){
  return `<div class="tgrid" style="grid-template-rows:repeat(${l.rows},1fr);grid-template-columns:repeat(${l.cols},1fr)">${l.cells.map(([r, c, rs, cs, rot]) => `<div style="grid-row:${r} / span ${rs};grid-column:${c} / span ${cs}"><span style="transform:rotate(${rot}deg)">${game.startLife}</span></div>`).join('')}</div>`;
}
let pickN = null;
function layoutSheet(){
  const n = pickN || curLayout().n;
  showSheet(`<h3>Jugadores y orientación</h3><p class="lead">Elige cuántos juegan y cómo se acomodan alrededor de la mesa. Al cambiar, las vidas se reinician; los jugadores y mazos se conservan.</p>
    <div class="ncount">${[2,3,4,5,6].map(k => `<button class="nbtn ${k === n ? 'on' : ''}" data-act="mesaLayoutN" data-n="${k}">${k}<small>JUGADORES</small></button>`).join('')}</div>
    <div class="lgrid">${LAYOUTS.filter(l => l.n === n).map(l => `<button class="lthumb ${l.id === game.layout ? 'on' : ''}" data-act="mesaSetLayout" data-l="${l.id}" title="Orientación ${l.id}">${layoutThumb(l)}</button>`).join('')}</div>
    <div class="sheet-actions"><button class="btn ghost" data-act="mesaCloseOv">Cerrar</button></div>`);
}
function pickPlayerSheet(i, memberId){
  const p = game.players[i];
  if(!memberId){
    showSheet(`<h3>¿Quién se sienta aquí?</h3><p class="lead">Lugar ${i + 1}. Elige a un jugador (los que ya han entrado a Mana Beer) y luego su mazo.</p>
      <div class="mgrid">${members.map(m => `<button class="mbtn ${p.member === m.id ? 'on' : ''}" data-act="pickMember" data-i="${i}" data-m="${m.id}">${avatarHtml(m, 'style="width:52px;height:52px;font-size:20px;border:2px solid #B9781A"')}${esc(m.name)}${m.uid === user.uid ? ' (tú)' : ''}<small>${memberDecks(m).length} mazo(s)</small></button>`).join('')}</div>
      <div class="sheet-actions">${p.member ? `<button class="btn ghost danger" data-act="clearSeat" data-i="${i}">Dejar el lugar vacío</button>` : ''}<button class="btn ghost" data-act="mesaCloseOv">Cerrar</button></div>`);
    return;
  }
  const m = memberById(memberId), ds = memberDecks(m);
  showSheet(`<h3>${esc(m.name)}: ¿con qué mazo juega?</h3><p class="lead">La ilustración del comandante quedará de fondo en su contador.</p>
    <div class="dgrid">${ds.map(d => `<button class="dbtn ${p.deck && p.deck.id === d.id ? 'on' : ''}" data-act="pickDeck" data-i="${i}" data-m="${m.id}" data-d="${d.id}" style="${artOf(d.artCard, d.art) ? `background-image:url('${artOf(d.artCard, d.art)}')` : ''}"><span><b>${esc(d.name)}</b><small>${esc(d.commander || d.format)}</small></span></button>`).join('') || '<p class="hint">Este jugador aún no tiene mazos cargados.</p>'}</div>
    <div class="sheet-actions"><button class="btn ghost" data-act="pickPlayer" data-i="${i}">Regresar</button><button class="btn" data-act="pickDeck" data-i="${i}" data-m="${m.id}" data-d="">Jugar sin mazo</button></div>`);
}
function mesaToast(msg){
  const el = document.createElement('div'); el.className = 'mesa-toast'; el.textContent = msg;
  $('#mesa').appendChild(el); setTimeout(() => el.remove(), 2800);
}
// Tirada de d20: el más alto empieza (empates vuelven a tirar)
async function rollStart(){
  closeOv();
  let pool = game.players.map((_, i) => i);
  game.starter = null; document.querySelectorAll('.pcell').forEach(c => c.classList.remove('starter'));
  document.querySelectorAll('.startflag').forEach(e => e.remove());
  while(pool.length > 1){
    const vals = {};
    for(let t = 0; t < 16; t++){
      pool.forEach(i => { const r = $('#roll' + i); r.className = 'roll show'; r.innerHTML = 1 + Math.floor(Math.random() * 20); });
      await sleep(40 + t * 6);
    }
    pool.forEach(i => { vals[i] = 1 + Math.floor(Math.random() * 20); $('#roll' + i).innerHTML = vals[i] + '<small>d20</small>'; });
    const max = Math.max(...Object.values(vals));
    const tied = pool.filter(i => vals[i] === max);
    await sleep(900);
    if(tied.length > 1){ tied.forEach(i => { $('#roll' + i).innerHTML = vals[i] + '<small>EMPATE · OTRA VEZ</small>'; }); await sleep(900); }
    pool.forEach(i => { if(!tied.includes(i)) $('#roll' + i).className = 'roll'; });
    pool = tied;
  }
  const w = pool[0];
  $('#roll' + w).className = 'roll show win'; $('#roll' + w).innerHTML = '¡EMPIEZA!';
  await sleep(1300);
  game.starter = w; saveGame(); renderMesa();
  mesaToast(`Empieza ${pName(w)}`);
}
function saveMatch(w){
  const players = game.players.map(p => snapPlayer(p.member, p.deck ? { ...p.deck, artCard: p.deck.artCard } : null));
  const m = { date:Date.now(), minutes: Math.max(1, Math.round((Date.now() - game.started) / 60000)), startLife: game.startLife, players, winner:w, starter: game.starter == null ? -1 : game.starter, createdBy: user.uid, createdByName: user.name };
  matchList.unshift({ ...m, id:'local-' + uid() });
  db.collection('mb_partidas').add(m).then(ref => { matchList[0].id = ref.id; }).catch(e => { console.error(e); mesaToast('No se pudo guardar la partida en la nube.'); });
  newGame(game.layout, game.startLife, true);
  renderMesa();
  mesaToast(`Partida guardada · Gana ${players[w].memberName}. ¡Salud!`);
}
const mesaActions = {
  mesaMenu(){ mesaMenuOpen ? closeOv() : openMenu(); },
  mesaCloseOv(){ closeOv(); },
  mesaExit(){ closeOv(); view = { tab:'decks', deckId:null, statusFilter:null }; render(); },
  mesaLayout(){ pickN = null; layoutSheet(); },
  mesaLayoutN(el){ pickN = +el.dataset.n; layoutSheet(); },
  mesaSetLayout(el){ newGame(el.dataset.l, game.startLife, true); pickN = null; mesaPanel = null; renderMesa(); },
  mesaRoll(){ rollStart(); },
  mesaReset(){
    showSheet(`<h3>¿Reiniciar la partida?</h3><p class="lead">Las vidas vuelven a ${game.startLife} y se borran veneno, daño de comandante y maná. El formato (${curFormat().name}) se mantiene. Los jugadores y sus mazos se quedan.</p>
      <div class="sheet-actions"><button class="btn ghost" data-act="mesaCloseOv">Cancelar</button><button class="btn primary" data-act="mesaResetOk">Sí, reiniciar</button></div>`);
  },
  mesaResetOk(){ newGame(game.layout, game.startLife, true); mesaPanel = null; renderMesa(); mesaToast('Partida reiniciada'); },
  mesaSettings(){
    showSheet(`<h3>Ajustes de la mesa</h3><p class="lead">Elige el formato y la mesa se acomoda sola: jugadores, vidas y daño de comandante. Al cambiar, la partida se reinicia; los jugadores y sus mazos se quedan.</p>
      <label class="f">Formato</label>
      <div class="fmtgrid">${MESA_FORMATS.map(f => `<button class="fmtbtn ${f.id === game.format ? 'on' : ''}" data-act="mesaFormat" data-f="${f.id}"><b>${f.name}</b><small>${f.n} jugadores · ${f.life} vidas${f.cmd ? ' · comandante' : ''}</small></button>`).join('')}</div>
      <label class="f">Vida inicial</label>
      <div class="optgrid">${[20,25,30,40,50].map(v => `<button class="optbtn ${v === game.startLife ? 'on' : ''}" data-act="mesaLife" data-v="${v}">${v}</button>`).join('')}</div>
      <p class="hint" style="margin-top:10px">Si quieren más o menos jugadores que los del formato, cámbialo en «Jugadores» del menú.</p>
      <div class="sheet-actions"><button class="btn ghost" data-act="mesaCloseOv">Cerrar</button></div>`);
  },
  mesaFormat(el){
    const f = MESA_FORMATS.find(x => x.id === el.dataset.f); if(!f) return;
    const layout = curLayout().n === f.n ? game.layout : f.layout;
    game.format = f.id;
    newGame(layout, f.life, true); mesaPanel = null; renderMesa();
    mesaToast(`${f.name}: ${f.n} jugadores · ${f.life} vidas`);
  },
  cmdExit(){ game.cmdTarget = null; saveGameSoon(); renderMesa(); },
  // Daño de comandante: lo suma el rival en su celda y se resta de la vida de quien lo recibe
  cmdDmg(el){
    const T = game.cmdTarget; if(T == null) return;
    const a = +el.dataset.a, k = +el.dataset.k, d = +el.dataset.d, tgt = game.players[T];
    tgt.cmd = tgt.cmd || {};
    const arr = Array.isArray(tgt.cmd[a]) ? tgt.cmd[a] : (tgt.cmd[a] = []);
    const cur = arr[k] || 0, nv = Math.max(0, cur + d);
    if(nv === cur) return;
    arr[k] = nv; tgt.life -= (nv - cur);
    saveGameSoon(); renderCell(a); renderCell(T); checkWinner();
  },
  cmdSlot(el){
    const a = +el.dataset.a, d = +el.dataset.d, p = game.players[a], n = p.cmdN || 1;
    if(d > 0){ p.cmdN = Math.min(MAX_CMDRS, n + 1); }
    else {
      const used = game.players.some(q => q.cmd && Array.isArray(q.cmd[a]) && (q.cmd[a][n - 1] || 0) > 0);
      if(used){ mesaToast('Ese comandante ya hizo daño: no se puede quitar.'); return; }
      p.cmdN = Math.max(1, n - 1);
    }
    saveGameSoon(); renderCell(a);
  },
  mesaLife(el){ newGame(game.layout, +el.dataset.v, true); renderMesa(); mesaToast(`Vida inicial: ${el.dataset.v}`); },
  mesaEnd(){
    showSheet(`<h3>Terminar partida</h3><p class="lead">¿Quién ganó? La partida se guarda en el Ranking con los mazos de cada jugador.</p>
      <div class="wlist">${game.players.map((p, i) => `<button class="wbtn ${isDead(p) ? 'out' : ''}" data-act="mesaSaveMatch" data-i="${i}"><span class="dthumb" style="${p.deck && artOf(p.deck.artCard, p.deck.art) ? `background-image:url('${artOf(p.deck.artCard, p.deck.art)}')` : ''}"></span><span><b>${esc(pName(i))}</b><br><small style="color:var(--muted)">${p.deck ? esc(p.deck.name) : 'Sin mazo'} · ${p.life} de vida${isDead(p) ? ' · fuera' : ''}</small></span></button>`).join('')}</div>
      <div class="sheet-actions"><button class="btn ghost danger" data-act="mesaDiscard">Descartar (no guardar)</button><button class="btn ghost" data-act="mesaCloseOv">Seguir jugando</button></div>`);
  },
  mesaSaveMatch(el){ closeOv(); saveMatch(+el.dataset.i); },
  mesaDiscard(){ newGame(game.layout, game.startLife, true); renderMesa(); mesaToast('Partida descartada'); },
  pickPlayer(el){ pickPlayerSheet(+el.dataset.i); },
  pickMember(el){ pickPlayerSheet(+el.dataset.i, el.dataset.m); },
  pickDeck(el){
    const i = +el.dataset.i, m = memberById(el.dataset.m), d = memberDecks(m).find(x => x.id === el.dataset.d);
    game.players[i].member = m.id;
    game.players[i].deck = d ? { id:d.id, name:d.name, commander:d.commander, artCard:d.artCard, art: artOf(d.artCard, d.art) } : null;
    saveGame(); closeOv(); renderCell(i);
  },
  clearSeat(el){ const i = +el.dataset.i; game.players[i].member = null; game.players[i].deck = null; saveGame(); closeOv(); renderCell(i); },
  counters(el){ renderCounters(+el.dataset.i, el.dataset.t); },
  closeCounters(el){ mesaPanel = null; const h = $('#cp' + el.dataset.i); if(h) h.innerHTML = ''; },
  cnt(el){
    const i = +el.dataset.i, p = game.players[i], d = +el.dataset.d, k = el.dataset.k;
    if(k === 'poison'){ p.poison = Math.max(0, p.poison + d); }
    else { p.mana[el.dataset.j] = Math.max(0, (p.mana[el.dataset.j] || 0) + d); }
    saveGameSoon(); renderCell(i); checkWinner();
  },
  manaClear(el){ const i = +el.dataset.i; MANA_KEYS.forEach(k => game.players[i].mana[k] = 0); saveGameSoon(); renderCell(i); }
};

//   DATOS DE EJEMPLO

async function preloadAll(){
  const names = new Set();
  data.decks.forEach(d => d.cards.forEach(c => names.add(c.name)));
  Object.values(data.inv).forEach(r => names.add(r.name));
  Object.values(data.wish).forEach(w => names.add(w.name));
  const prints = [];
  data.decks.forEach(d => d.cards.forEach(c => { if(c.set && c.cn) prints.push({ name:c.name, set:c.set, cn:c.cn }); }));
  await ensurePrints(prints);
  await ensureCards([...names]);
  if(enrichStored()) saveData(); else if(!saved.pub) saveData();
  if(view.tab !== 'mesa') renderKeepScroll();
}
