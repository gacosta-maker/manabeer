<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis actividades</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --surface3:#e7eaef;
    --border:#e0e3e9; --border-strong:#cfd4dc;
    --text:#1b2027; --muted:#6b7280; --faint:#9aa2ad;
    --teal:#0f8f6a; --teal-bg:#e2f4ee;
    --amber:#a9700a; --amber-bg:#fbeeda;
    --red:#c23a39; --red-bg:#fbe7e7;
    --accent:#2f6db0; --accent-bg:#e8f1fb;
    --radius:10px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#13171c; --surface:#1b212a; --surface2:#232b35; --surface3:#2b333f;
    --border:#2c333d; --border-strong:#3a434f;
    --text:#e7eaef; --muted:#8b94a1; --faint:#69727f;
    --teal:#2fb98c; --teal-bg:#123027;
    --amber:#e6a13a; --amber-bg:#3a2c11;
    --red:#e8605f; --red-bg:#3a1c1c;
    --accent:#5c9fe0; --accent-bg:#14273b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
  h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
  .date{font-size:13px;color:var(--muted)}
  .themebtn{background:none;border:0.5px solid var(--border-strong);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
  .themebtn:hover{background:var(--surface2)}
  .stats{display:flex;gap:8px;margin:16px 0 20px}
  .stat{flex:1;background:var(--surface2);border-radius:var(--radius);padding:10px 14px}
  .stat .n{font-size:22px;font-weight:600;line-height:1.1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)}
  .add{display:flex;gap:8px;margin-bottom:22px}
  .add input{flex:1;height:42px;background:var(--surface);border:0.5px solid var(--border-strong);border-radius:var(--radius);color:var(--text);padding:0 14px;font-size:15px;font-family:inherit}
  .add input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .add button{height:42px;padding:0 18px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
  .add button:hover{filter:brightness(1.05)}
  .card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;border-left:3px solid transparent;transition:border-color .15s}
  .card.red{border-left-color:var(--red)}
  .card.amber{border-left-color:var(--amber)}
  .card.done{opacity:.55}
  .chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .title{font-size:15px;font-weight:500;flex:1;cursor:pointer}
  .title:hover{color:var(--accent)}
  .card.done .title{text-decoration:line-through;color:var(--muted)}
  .badge{font-size:11px;border-radius:20px;padding:3px 10px;white-space:nowrap;display:flex;align-items:center;gap:4px;font-weight:500}
  .badge.red{background:var(--red-bg);color:var(--red)}
  .badge.amber{background:var(--amber-bg);color:var(--amber)}
  .badge.ok{background:var(--surface2);color:var(--muted)}
  .badge.done{background:var(--teal-bg);color:var(--teal)}
  .prog{display:flex;align-items:center;gap:10px;margin:11px 0 5px}
  .bar{flex:1;height:8px;background:var(--surface3);border-radius:20px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--teal);border-radius:20px;transition:width .3s}
  .pct{font-size:12px;font-weight:600;min-width:36px;text-align:right}
  .sub{font-size:12px;color:var(--muted);margin-bottom:9px}
  .sub b{color:var(--text);font-weight:500}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint)}
  .meta .i{vertical-align:-2px;margin-right:3px;font-style:normal}
  .meta b{font-weight:600}
  .meta b.red{color:var(--red)} .meta b.amber{color:var(--amber)}
  .panel{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:none;grid-template-columns:1fr 1fr;gap:12px}
  .panel.open{display:grid}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11px;color:var(--muted);font-weight:500}
  .fld input,.fld select{height:34px;background:var(--surface2);border:0.5px solid var(--border-strong);border-radius:8px;color:var(--text);padding:0 8px;font-size:13px;font-family:inherit}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
  .adv{grid-column:1/-1;display:flex;align-items:end;gap:8px;flex-wrap:wrap}
  .adv .g{display:flex;flex-direction:column;gap:4px}
  .adv input{width:70px}
  .adv button{height:34px;padding:0 12px;background:var(--teal);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
  .adv .del{background:none;border:0.5px solid var(--border-strong);color:var(--red);margin-left:auto}
  .adv .del:hover{background:var(--red-bg)}
  .empty{text-align:center;color:var(--muted);padding:48px 0;font-size:14px}
  .sec{font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Mis actividades</h1>
      <div class="date" id="today"></div>
    </div>
    <button class="themebtn" id="theme" title="Cambiar tema">◐</button>
  </div>

  <div class="stats">
    <div class="stat red"><div class="n" id="s-red">0</div><div class="l">vencidas / hoy</div></div>
    <div class="stat amber"><div class="n" id="s-amber">0</div><div class="l">por vencer</div></div>
    <div class="stat"><div class="n" id="s-act">0</div><div class="l">activas</div></div>
    <div class="stat"><div class="n" id="s-done">0</div><div class="l">terminadas</div></div>
  </div>

  <div class="add">
    <input id="newin" placeholder="Escribe una actividad nueva y presiona Enter…" autocomplete="off">
    <button id="addbtn">+ Agregar</button>
  </div>

  <div id="list"></div>
</div>

<script>
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const KEY = 'actividades:v1';
let acts = [];

const fmt = d => { if(!d) return null; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString('es-MX',{day:'numeric',month:'short'}); };
const iso = d => d.toISOString().slice(0,10);
function bizAdd(start, days){ let d=new Date(start), n=0; while(n<days){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n++; } return d; }
function bizBetween(a,b){ let d=new Date(a), n=0; while(d<b){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n++; } return n; }

function daysToCompromiso(a){ if(!a.compromiso||a.status==='Terminada') return null; const c=new Date(a.compromiso+'T00:00:00'); return Math.round((c-TODAY)/86400000); }
function alertLevel(a){ const d=daysToCompromiso(a); if(d===null) return 'ok'; if(d<=0) return 'red'; if(d<=2) return 'amber'; return 'ok'; }
function pct(a){ if(!a.total||a.total<=0) return a.status==='Terminada'?100:(a.done||0); return Math.min(100, Math.round((a.done/a.total)*100)); }

function forecast(a){
  if(!a.total||a.total<=0||!a.done||a.done>=a.total) return null;
  if(!a.log||!a.log.length) return null;
  const first = a.log.reduce((m,l)=> l.date<m?l.date:m, a.log[0].date);
  const fd = new Date(first+'T00:00:00');
  const elapsed = Math.max(1, bizBetween(fd, TODAY)+1);
  const rate = a.done/elapsed;
  if(rate<=0) return null;
  const remaining = a.total-a.done;
  const need = Math.ceil(remaining/rate);
  return { date: bizAdd(TODAY, need), rate: rate };
}

function load(){
  try{ const v = localStorage.getItem(KEY); if(v){ acts = JSON.parse(v); return; } }catch(e){}
  acts = seed();
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(acts)); }catch(e){}
}

function seed(){
  const t = iso(TODAY);
  const rel = n => { const d=new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); };
  return [
    {id:id(), title:'Análisis requerimiento — Leonardo (Marese)', status:'En proceso', done:60, total:100, compromiso:rel(-2), fin:rel(19), updated:rel(-3), created:rel(-10), log:[{date:rel(-10),amount:60}]},
    {id:id(), title:'Revisar BL nuevos', status:'En proceso', done:5, total:100, compromiso:rel(2), fin:'', updated:t, created:rel(-1), log:[{date:t,amount:5}]},
    {id:id(), title:'Burmester — machotes de contratos', status:'En proceso', done:2, total:7, compromiso:rel(12), fin:rel(58), updated:rel(-6), created:rel(-40), log:[{date:rel(-40),amount:1},{date:rel(-12),amount:1}]},
    {id:id(), title:'CTR — indexado de productos', status:'En proceso', done:5, total:100, compromiso:rel(26), fin:'', updated:rel(-3), created:rel(-30), log:[{date:rel(-30),amount:5}]},
    {id:id(), title:'API SERVIPROF — esperando cliente', status:'En espera', done:0, total:0, compromiso:'', fin:'', updated:rel(-5), created:rel(-20), log:[]},
    {id:id(), title:'CTR — diferencia de centavos', status:'En proceso', done:0, total:0, compromiso:rel(0), fin:'', updated:rel(-1), created:rel(-14), log:[]},
  ];
}
function id(){ return 'a'+Math.random().toString(36).slice(2,9); }

function render(){
  document.getElementById('today').textContent = TODAY.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const rank = {red:0, amber:1, ok:2};
  const active = acts.filter(a=>a.status!=='Terminada').sort((x,y)=>{
    const rx=rank[alertLevel(x)], ry=rank[alertLevel(y)]; if(rx!==ry) return rx-ry;
    const cx=x.compromiso||'9999', cy=y.compromiso||'9999'; return cx<cy?-1:cx>cy?1:0;
  });
  const done = acts.filter(a=>a.status==='Terminada');

  document.getElementById('s-red').textContent = active.filter(a=>alertLevel(a)==='red').length;
  document.getElementById('s-amber').textContent = active.filter(a=>alertLevel(a)==='amber').length;
  document.getElementById('s-act').textContent = active.length;
  document.getElementById('s-done').textContent = done.length;

  const list = document.getElementById('list');
  if(!acts.length){ list.innerHTML='<div class="empty">Sin actividades. Agrega la primera arriba.</div>'; return; }
  let html = active.map(card).join('');
  if(done.length) html += '<div class="sec">Terminadas</div>' + done.map(card).join('');
  list.innerHTML = html;
}

function card(a){
  const lvl = a.status==='Terminada'?'done':alertLevel(a);
  const p = pct(a);
  let badge;
  if(a.status==='Terminada') badge='<span class="badge done">✓ terminada</span>';
  else if(lvl==='red'){ const d=daysToCompromiso(a); badge=`<span class="badge red">⚠ ${d<0?'vencida '+(-d)+'d':'vence hoy'}</span>`; }
  else if(lvl==='amber'){ const d=daysToCompromiso(a); badge=`<span class="badge amber">⏱ en ${d}d</span>`; }
  else if(a.status==='En espera') badge='<span class="badge ok">en espera</span>';
  else badge='<span class="badge ok">en tiempo</span>';

  const f = forecast(a);
  let subline='';
  if(a.total>0){
    subline = `<div class="sub">${a.done||0} de ${a.total} · faltan ${a.total-(a.done||0)}` +
      (f?` · ritmo ${f.rate.toFixed(1)}/día → <b>pronóstico ${fmt(iso(f.date))}</b>`:'') + `</div>`;
  }
  const cd = daysToCompromiso(a);
  const cclass = cd!==null && cd<=0 ? 'red' : cd!==null && cd<=2 ? 'amber' : '';
  const meta = `<div class="meta">
    <span><i class="i">⚑</i>compromiso ${a.compromiso?`<b class="${cclass}">${fmt(a.compromiso)}</b>`:'—'}</span>
    <span><i class="i">✓</i>fecha fin ${a.fin?fmt(a.fin):'sin definir'}</span>
    <span><i class="i">↻</i>act. ${a.updated?fmt(a.updated):'—'}</span>
  </div>`;

  return `<div class="card ${lvl}" data-id="${a.id}">
    <div class="chead"><div class="title" onclick="toggle('${a.id}')">${esc(a.title)}</div>${badge}</div>
    <div class="prog"><div class="bar"><i style="width:${p}%"></i></div><div class="pct">${p}%</div></div>
    ${subline}${meta}
    <div class="panel" id="p-${a.id}">
      <div class="fld"><label>Estado</label><select onchange="upd('${a.id}','status',this.value)">
        ${['Nueva','En proceso','En espera','Terminada'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      <div class="fld"><label>Meta total (opcional)</label><input type="number" min="0" value="${a.total||''}" onchange="upd('${a.id}','total',this.value)"></div>
      <div class="fld"><label>Fecha compromiso</label><input type="date" value="${a.compromiso||''}" onchange="upd('${a.id}','compromiso',this.value)"></div>
      <div class="fld"><label>Fecha fin (proyecto)</label><input type="date" value="${a.fin||''}" onchange="upd('${a.id}','fin',this.value)"></div>
      <div class="adv">
        <div class="g"><label>Registrar avance de hoy</label><input type="number" min="0" placeholder="0" id="adv-${a.id}"></div>
        <button onclick="advance('${a.id}')">+ Sumar</button>
        <button class="del" onclick="del('${a.id}')">Eliminar</button>
      </div>
    </div>
  </div>`;
}

function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function find(id){ return acts.find(a=>a.id===id); }
function toggle(id){ const p=document.getElementById('p-'+id); p.classList.toggle('open'); }

function upd(id, field, val){
  const a=find(id); if(!a) return;
  if(field==='total') val = val===''?0:parseInt(val)||0;
  a[field]=val; a.updated=iso(TODAY);
  if(field==='status'&&val==='Terminada'&&a.total>0) a.done=a.total;
  save(); render(); reopen(id);
}
function advance(id){
  const a=find(id); if(!a) return;
  const el=document.getElementById('adv-'+id); const n=parseInt(el.value)||0;
  if(n<=0) return;
  a.done=(a.done||0)+n; a.updated=iso(TODAY);
  a.log=a.log||[]; a.log.push({date:iso(TODAY),amount:n});
  if(a.total>0&&a.done>=a.total){ a.done=a.total; a.status='Terminada'; }
  save(); render();
}
function del(id){ acts=acts.filter(a=>a.id!==id); save(); render(); }
function reopen(id){ const p=document.getElementById('p-'+id); if(p) p.classList.add('open'); }

function add(){
  const el=document.getElementById('newin'); const t=el.value.trim(); if(!t) return;
  acts.push({id:id(), title:t, status:'Nueva', done:0, total:0, compromiso:'', fin:'', updated:iso(TODAY), created:iso(TODAY), log:[]});
  el.value=''; save(); render();
}
document.getElementById('addbtn').onclick=add;
document.getElementById('newin').addEventListener('keydown',e=>{ if(e.key==='Enter') add(); });

const themeBtn=document.getElementById('theme');
let dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){ document.documentElement.setAttribute('data-theme', dark?'dark':'light'); }
themeBtn.onclick=()=>{ dark=!dark; applyTheme(); };
applyTheme();

load(); render();
</script>
